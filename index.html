
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Or Éternel | Private Valentine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #fdfbf7;
        color: #3d2c00;
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
      }
      .serif {
        font-family: 'Playfair Display', serif;
      }
      .gold-text {
        background: linear-gradient(to bottom, #d4af37 0%, #b8860b 50%, #8b6b00 100%);
        -webkit-background-clip: text;
        -webkit-fill-color: transparent;
        color: #b8860b; /* Fallback */
      }
      .gold-border {
        border: 1px solid #d4af37;
      }
      .gold-glow {
        filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.3));
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #fdfbf7;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5dcc3;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d4af37;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",

  }
}
</script>
</head>
  <body>
    <svg style="display: none;">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
    </svg>
    <div id="root"></div>
    <!-- Entry point for JS -->
    <script type="module" src="index.js"></script>
